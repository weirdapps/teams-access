name: CI
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
# Minimal token scope. Added 2026-09-20: this workflow had no
# permissions: key, so GITHUB_TOKEN arrived with the repository default,
# which on these repos is write across contents, issues, pull-requests and
# more. Nothing here writes anything; it checks out and runs checks.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
  pii-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: bash scripts/pii-gauntlet.sh
