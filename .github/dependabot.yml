version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'weirdapps'
    assignees:
      - 'weirdapps'
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    ignore:
      # typescript 7 cannot be installed here. Every published
      # @typescript-eslint release (8.67.0 is latest) still declares
      # peerDependencies.typescript ">=4.8.4 <6.1.0", so npm has no resolvable
      # tree with typescript 7.x. Dependabot's updater hangs on the peer
      # co-update for its full 900s inactivity window and then reports
      # dependency_file_not_resolvable: this is what turned the "Dependabot
      # Updates" workflow red on 2026-07-13 (run 29238801059) and 2026-07-20
      # (run 29731112476), and why PR #26 was closed unmerged.
      # Scope is version-update only, so 6.x patch/minor bumps and any
      # typescript security advisory still come through.
      # REMOVE this entry as soon as @typescript-eslint ships a release whose
      # typescript peer range covers 7.x.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # The vitest family must move as one PR. @vitest/coverage-v8 declares an
      # EXACT peer on its runner ('peer vitest@"4.1.11" from
      # @vitest/coverage-v8@4.1.11'), so a PR that bumps one and not the other
      # produces a tree npm cannot resolve and `npm ci` dies on ERESOLVE before
      # a single test runs. development-dependencies below is filtered to
      # minor/patch, so a major like 4.1.11 -> 5.0.0 fell OUT of that group and
      # dependabot opened one PR per package: that is PR #6 and PR #7, both
      # permanently red. This group carries NO update-types key, which means
      # all semver levels, and it is listed FIRST because a dependency joins
      # the first group it matches.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci'
      include: 'scope'
