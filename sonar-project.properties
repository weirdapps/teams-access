# SonarCloud configuration for TypeScript/JavaScript projects
# Replace weirdapps, weirdapps_teams-access, and teams-access with your values

sonar.organization=weirdapps
sonar.projectKey=weirdapps_teams-access
sonar.projectName=teams-access

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
# .github/** is excluded on evidence, not taste: YAML was billing 3,362
# ncloc across the org and had produced exactly zero issues in any of the
# thirteen projects. On the free plan's 50,000-line ceiling that is 7% of
# the budget for no findings. Re-include it if Sonar's Actions rules ever
# grow teeth.
sonar.exclusions=\
  .github/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/test_scripts/**,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.js

# Test exclusions
sonar.test.exclusions=\
  **/test_scripts/**,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.js
